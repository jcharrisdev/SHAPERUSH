<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ShapeRush ⚡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@300;400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root{
  --cyan:#00f5ff;--pink:#ff006e;--yellow:#ffbe0b;--green:#06d6a0;--purple:#a855f7;
  --bg:#04040f;--bg2:#080818;--glass:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
}

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}

body{font-family:'Exo 2',sans-serif;touch-action:none;user-select:none;}

/* ── CANVAS ── */
#gameCanvas{position:fixed;inset:0;display:block;}

/* ── HUD ── */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;
  background:linear-gradient(to bottom,rgba(4,4,15,0.9),transparent);
  pointer-events:none;
}
.hud-block{display:flex;flex-direction:column;align-items:center;}
.hud-label{font-size:0.55rem;letter-spacing:3px;color:rgba(255,255,255,0.35);text-transform:uppercase;margin-bottom:2px;}
.hud-val{font-family:'Orbitron',monospace;font-weight:900;font-size:1.2rem;color:#fff;}
#hudScore{text-shadow:0 0 14px var(--cyan);}
#hudLives{font-size:1rem;letter-spacing:2px;}
#hudBest{color:var(--yellow);text-shadow:0 0 14px rgba(255,190,11,0.5);}
.hud-block{min-width:80px;}

/* ── SHAPE HINT BAR ── */
#hintBar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:8px 20px 12px;
  background:linear-gradient(to top,rgba(4,4,15,0.9),transparent);
  pointer-events:none;
}
#hintBar span{font-size:0.62rem;letter-spacing:3px;color:rgba(255,255,255,0.35);text-transform:uppercase;}
#hintCanvas{border-radius:50%;}

/* ── LANE TOUCH ZONES ── */
#touchLeft,#touchRight{
  position:fixed;top:0;bottom:0;z-index:25;width:40%;
  opacity:0;
}
#touchLeft{left:0;}
#touchRight{right:0;}

/* ── SCREENS ── */
.screen{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,4,15,0.96);backdrop-filter:blur(12px);
  padding:24px;
}
.screen.hidden{display:none;}

/* LOGO */
.logo{
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(2.2rem,9vw,4rem);
  letter-spacing:6px;color:#fff;
  text-shadow:0 0 30px var(--cyan),0 0 60px var(--cyan);
  animation:logoPulse 2s ease-in-out infinite;
  margin-bottom:4px;
}
@keyframes logoPulse{
  0%,100%{text-shadow:0 0 20px var(--cyan),0 0 40px var(--cyan);}
  50%{text-shadow:0 0 50px var(--cyan),0 0 100px var(--cyan),0 0 150px rgba(0,245,255,0.3);}
}
.tagline{font-size:0.72rem;letter-spacing:5px;color:rgba(255,255,255,0.35);text-transform:uppercase;margin-bottom:36px;}

/* GLASS CARD */
.card{
  background:var(--glass);border:1px solid var(--border);border-radius:20px;
  padding:20px 24px;width:100%;max-width:340px;margin-bottom:20px;
}
.card-title{font-size:0.62rem;letter-spacing:3px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:14px;text-align:center;}

/* INPUT */
.input-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.game-input{
  flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;padding:12px 14px;color:#fff;font-family:'Exo 2',sans-serif;
  font-size:0.95rem;letter-spacing:1px;outline:none;transition:border 0.2s;
}
.game-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,245,255,0.1);}
.game-input::placeholder{color:rgba(255,255,255,0.2);}
#inputError{font-size:0.72rem;color:var(--pink);text-shadow:0 0 8px var(--pink);min-height:16px;text-align:center;margin-top:4px;}

/* BUTTONS */
.btn{
  width:100%;padding:15px;border-radius:50px;border:none;cursor:pointer;
  font-family:'Orbitron',monospace;font-weight:700;font-size:0.9rem;letter-spacing:3px;
  text-transform:uppercase;transition:all 0.2s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--cyan),#0099ff);color:#04040f;
  box-shadow:0 0 24px rgba(0,245,255,0.4);
}
.btn-primary:active{transform:scale(0.97);box-shadow:0 0 40px rgba(0,245,255,0.6);}
.btn-ghost{
  background:transparent;border:1.5px solid rgba(255,255,255,0.2);
  color:rgba(255,255,255,0.6);font-size:0.75rem;padding:10px;
  margin-top:8px;
}
.btn-ghost:active{border-color:var(--cyan);color:var(--cyan);}

/* THEME PICKER */
.themes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px;}
.theme-btn{
  width:52px;height:52px;border-radius:12px;border:2px solid transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;background:rgba(255,255,255,0.06);transition:all 0.2s;
  flex-direction:column;gap:2px;
}
.theme-btn span{font-size:0.45rem;letter-spacing:1px;color:rgba(255,255,255,0.4);text-transform:uppercase;}
.theme-btn.active{border-color:var(--cyan);background:rgba(0,245,255,0.12);box-shadow:0 0 16px rgba(0,245,255,0.3);}

/* STATS */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.stat-row:last-child{border-bottom:none;}
.stat-label{font-size:0.72rem;color:rgba(255,255,255,0.4);letter-spacing:1px;}
.stat-val{font-family:'Orbitron',monospace;font-size:0.9rem;color:var(--cyan);}

/* SCORE BIG */
.score-big{
  font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(2.5rem,10vw,4.5rem);color:#fff;
  text-shadow:0 0 30px var(--yellow);line-height:1;margin:12px 0;
}
.score-rank{font-size:0.7rem;letter-spacing:3px;color:var(--yellow);text-transform:uppercase;}

/* LEADERBOARD */
.lb-row{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.lb-rank{font-family:'Orbitron',monospace;font-size:0.75rem;color:rgba(255,255,255,0.3);width:22px;}
.lb-rank.gold{color:#ffd700;text-shadow:0 0 8px #ffd700;}
.lb-rank.silver{color:#c0c0c0;}
.lb-rank.bronze{color:#cd7f32;}
.lb-name{flex:1;font-size:0.82rem;color:rgba(255,255,255,0.75);}
.lb-score{font-family:'Orbitron',monospace;font-size:0.82rem;color:var(--cyan);}
.lb-me{background:rgba(0,245,255,0.07);border-radius:8px;padding:0 6px;margin:0 -6px;}

/* INSTRUCTIONS MINI */
.instruct{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.instruct-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:rgba(255,255,255,0.04);border-radius:10px;padding:8px 10px;min-width:64px;
}
.instruct-icon{font-size:1.2rem;}
.instruct-text{font-size:0.58rem;color:rgba(255,255,255,0.4);letter-spacing:1px;text-align:center;}

/* FLASH MESSAGE */
#flashMsg{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);
  z-index:60;font-family:'Orbitron',monospace;font-size:1rem;font-weight:700;
  letter-spacing:3px;padding:10px 24px;border-radius:40px;
  background:rgba(0,245,255,0.15);border:1px solid rgba(0,245,255,0.4);
  color:var(--cyan);text-shadow:0 0 10px var(--cyan);
  opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;
}
#flashMsg.show{opacity:1;}

/* SCROLLABLE */
.scroll-area{width:100%;max-height:220px;overflow-y:auto;scrollbar-width:none;}
.scroll-area::-webkit-scrollbar{display:none;}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:14px;}
.tab{
  flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;
  font-family:'Exo 2',sans-serif;font-size:0.72rem;letter-spacing:1px;
  background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);transition:all 0.2s;
}
.tab.active{background:rgba(0,245,255,0.12);color:var(--cyan);border:1px solid rgba(0,245,255,0.3);}

/* PROGRESS BAR */
#xpBar{
  position:fixed;top:56px;left:0;right:0;height:3px;z-index:29;
  background:rgba(255,255,255,0.06);
}
#xpFill{height:100%;background:linear-gradient(to right,var(--cyan),var(--purple));transition:width 0.2s ease-out;width:0%;}

/* COMBO HUD */
#comboHud{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:30;
  display:flex;align-items:baseline;gap:8px;pointer-events:none;
  font-family:'Orbitron',monospace;font-weight:900;
}
#comboMult{font-size:1.5rem;color:var(--cyan);text-shadow:0 0 14px var(--cyan);transition:color 0.2s;}
#comboCount{font-size:0.62rem;letter-spacing:2px;color:rgba(255,255,255,0.45);}
#comboHud.pop #comboMult{animation:comboPop 0.35s cubic-bezier(.2,1.6,.4,1);}
@keyframes comboPop{0%{transform:scale(1.9);}100%{transform:scale(1);}}
#comboHud.lost #comboMult{animation:comboLost 0.3s ease-out;}
@keyframes comboLost{0%{transform:translateX(-6px);color:var(--pink);}50%{transform:translateX(6px);}100%{transform:translateX(0);}}

/* RECORD HINT */
#recordHint{
  position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:30;
  font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:2px;font-weight:700;
  color:var(--yellow);text-shadow:0 0 10px rgba(255,190,11,0.6);
  white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.25s;
}
#recordHint.show{opacity:1;}
</style>
</head>
<body>

<!-- ══ CANVAS ══ -->
<canvas id="gameCanvas"></canvas>

<!-- ══ HUD ══ -->
<div id="hud">
  <div class="hud-block">
    <div class="hud-label">Score</div>
    <div class="hud-val" id="hudScore">0</div>
  </div>
  <div class="hud-block">
    <div class="hud-val" id="hudLives">❤️❤️❤️</div>
  </div>
  <div class="hud-block">
    <div class="hud-label">Best</div>
    <div class="hud-val" id="hudBest">0</div>
  </div>
</div>
<div id="xpBar"><div id="xpFill"></div></div>
<div id="comboHud"><span id="comboMult">x1</span><span id="comboCount"></span></div>
<div id="recordHint"></div>

<!-- ══ HINT BAR ══ -->
<div id="hintBar">
  <span>ATRAPA →</span>
  <canvas id="hintCanvas" width="34" height="34"></canvas>
</div>

<!-- ══ FLASH ══ -->
<div id="flashMsg"></div>

<!-- ══════════════════════════════════════
     SCREEN: WELCOME / LOGIN
══════════════════════════════════════ -->
<div class="screen" id="screenWelcome">
  <div class="logo">SHAPE<br>RUSH</div>
  <div class="tagline">Match · Evolve · Survive</div>

  <div class="card">
    <div class="card-title">¿Quién eres?</div>
    <div class="input-row">
      <input class="game-input" id="userInput" placeholder="Tu ID de jugador" maxlength="16" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="inputError"></div>
  </div>

  <div class="card">
    <div class="card-title">Elige tu personaje</div>
    <div class="themes" id="themePicker">
      <button class="theme-btn active" data-theme="geo">⬡<span>Geo</span></button>
      <button class="theme-btn" data-theme="emoji">😎<span>Emoji</span></button>
      <button class="theme-btn" data-theme="pixel">👾<span>Pixel</span></button>
      <button class="theme-btn" data-theme="neon">✦<span>Neon</span></button>
    </div>
  </div>

  <button class="btn btn-primary" id="btnStart">JUGAR</button>
  <button class="btn btn-ghost" id="btnLeaderboard">🏆 Clasificación Global</button>
</div>

<!-- ══════════════════════════════════════
     SCREEN: LEADERBOARD
══════════════════════════════════════ -->
<div class="screen hidden" id="screenLeaderboard">
  <div class="logo" style="font-size:1.8rem;margin-bottom:4px;">🏆 TOP</div>
  <div class="tagline" style="margin-bottom:20px;">CLASIFICACIÓN GLOBAL</div>

  <div class="card" style="max-width:340px;width:100%;">
    <div class="scroll-area" id="lbList">
      <div style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;padding:20px;">Cargando...</div>
    </div>
  </div>

  <button class="btn btn-ghost" id="btnBackLb">← VOLVER</button>
</div>

<!-- ══════════════════════════════════════
     SCREEN: GAME OVER
══════════════════════════════════════ -->
<div class="screen hidden" id="screenGameOver">
  <div class="logo" style="font-size:2rem;margin-bottom:4px;" id="goTitle">GAME OVER</div>
  <div class="score-rank" id="goRank"></div>
  <div class="score-big" id="goScore">0</div>

  <div class="card" style="max-width:340px;width:100%;">
    <div class="tabs">
      <button class="tab active" id="tabStats" onclick="showTab('stats')">Mi Partida</button>
      <button class="tab" id="tabLb" onclick="showTab('lb')">Top Global</button>
    </div>

    <div id="panelStats">
      <div class="stat-row"><span class="stat-label">Récord Personal</span><span class="stat-val" id="goRecord">—</span></div>
      <div class="stat-row"><span class="stat-label">Formas atrapadas</span><span class="stat-val" id="goCorrect">0</span></div>
      <div class="stat-row"><span class="stat-label">Mejor Combo</span><span class="stat-val" id="goBestCombo">0x</span></div>
      <div class="stat-row"><span class="stat-label">Nivel alcanzado</span><span class="stat-val" id="goLevel">1</span></div>
    </div>

    <div id="panelLb" class="hidden">
      <div class="scroll-area" id="goLbList">
        <div style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;padding:20px;">Cargando...</div>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" id="btnReplay">JUGAR DE NUEVO</button>
  <button class="btn btn-ghost" id="btnHome">🏠 Inicio</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG & CONSTANTS
// ═══════════════════════════════════════════════════════
const API = '/api'; // Vercel serverless functions

// All balance knobs live here. Tune the game by editing this object only.
const CONFIG = {
  LANE_COUNT: 3,
  STEP_MS: 1000 / 60,          // fixed simulation step
  MAX_FRAME_MS: 100,           // longest frame we simulate (acts as auto-pause when tab is hidden)
  HIT_X_LANE_FRACTION: 0.6,    // horizontal catch window, as a fraction of lane width
  HIT_Y_PX: 36,                // vertical catch window
  GAME_OVER_DELAY_FRAMES: 30,  // short beat between last life lost and game over screen
  START_LIVES: 3,

  // Score = BASE_SCORE * comboMultiplier * precisionMultiplier
  BASE_SCORE: 100,
  COMBO_THRESHOLDS: [          // consecutive catches needed for each multiplier
    { at: 1,  mult: 1 },
    { at: 5,  mult: 2 },
    { at: 10, mult: 3 },
    { at: 20, mult: 4 },
  ],
  // Precision = horizontal distance to the shape centre, as a fraction of lane width.
  // Being settled in the lane early gives PERFECT; sliding in at the last moment gives GOOD.
  PERFECT_THRESHOLD: 0.05,
  GREAT_THRESHOLD: 0.2,
  PRECISION_MULT: { GOOD: 1.0, GREAT: 1.25, PERFECT: 1.5 },

  // Near miss: a target passed within this many px of the catch window.
  NEAR_MISS_PX: 45,

  FLOATER_FRAMES: 42,          // floating text lifetime (~700ms)
  MAX_FLOATERS: 10,
};
const LANE_COUNT = CONFIG.LANE_COUNT;
const COMBO_COLORS = ['#00f5ff', '#00f5ff', '#ffbe0b', '#ff8a00', '#ff006e'];  // by multiplier tier

// ═══════════════════════════════════════════════════════
//  PROFILE — everything persisted on this device (never sent anywhere)
// ═══════════════════════════════════════════════════════
const Profile = (() => {
  const KEY = 'shaperush.v1';
  const DEFAULTS = {
    bestScore: 0, totalGames: 0, totalScore: 0, totalShapes: 0, highestCombo: 0,
    totalHits: 0, perfectHits: 0,
    lastId: '', theme: 'geo', muted: false, debug: false, seenIntro: false,
  };
  let data = { ...DEFAULTS };
  try { Object.assign(data, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  return {
    get: k => data[k],
    set(k, v) { data[k] = v; persist(); },
    update(patch) { Object.assign(data, patch); persist(); },
  };
})();

// ═══════════════════════════════════════════════════════
//  COMBO + SCORE (pure rules; state lives in `game`)
// ═══════════════════════════════════════════════════════
const ComboManager = {
  tierIndex(combo) {
    let idx = 0;
    CONFIG.COMBO_THRESHOLDS.forEach((t, i) => { if (combo >= t.at) idx = i; });
    return idx;
  },
  multiplierFor(combo) { return CONFIG.COMBO_THRESHOLDS[this.tierIndex(combo)].mult; },
  // Progress (0..1) towards the next multiplier; 1 when already at the top tier.
  progress(combo) {
    const T = CONFIG.COMBO_THRESHOLDS, i = this.tierIndex(combo);
    if (i >= T.length - 1) return 1;
    return (combo - T[i].at) / (T[i + 1].at - T[i].at);
  },
};

const ScoreManager = {
  precisionFor(offset) {
    const name = offset <= CONFIG.PERFECT_THRESHOLD ? 'PERFECT' : offset <= CONFIG.GREAT_THRESHOLD ? 'GREAT' : 'GOOD';
    return { name, mult: CONFIG.PRECISION_MULT[name] };
  },
  gain(comboMult, precision) { return Math.round(CONFIG.BASE_SCORE * comboMult * precision.mult); },
};


const GEO_SHAPES  = ['circle','triangle','square','diamond','pentagon','star','hexagon','cross'];
const EMOJI_SETS  = ['😀','😎','🤩','😜','🥳','😈','🤖','👽'];
const PIXEL_SETS  = ['👾','🎮','💎','⭐','🔥','⚡','❄️','🌀'];
const NEON_SHAPES = ['circle','triangle','square','diamond','pentagon','star','hexagon','cross'];

const COLORS = ['#ff006e','#00f5ff','#ffbe0b','#06d6a0','#ff4d6d','#a855f7','#f97316','#ec4899'];
const COLOR_GLOW = {
  '#ff006e':'rgba(255,0,110,0.6)','#00f5ff':'rgba(0,245,255,0.6)',
  '#ffbe0b':'rgba(255,190,11,0.6)','#06d6a0':'rgba(6,214,160,0.6)',
  '#ff4d6d':'rgba(255,77,109,0.6)','#a855f7':'rgba(168,85,247,0.6)',
  '#f97316':'rgba(249,115,22,0.6)','#ec4899':'rgba(236,72,153,0.6)',
};

// ═══════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════
let canvas, ctx, hintCanvas, hintCtx;
let game = {};
let currentUser = null;
let selectedTheme = 'geo';
let raf = null;
let lastFrameTime = 0, accumulator = 0;
let stars = [];

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  hintCanvas = document.getElementById('hintCanvas');
  hintCtx = hintCanvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  initStars();
  drawMenuBg();
  setupUI();
  document.getElementById('userInput').value = Profile.get('lastId');
  selectTheme(Profile.get('theme'));
});

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (game.player) {
    game.player.baseY = canvas.height * 0.78;
    if (!game.player.jumping) game.player.y = game.player.baseY;
  }
}

// ═══════════════════════════════════════════════════════
//  STAR FIELD
// ═══════════════════════════════════════════════════════
function initStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.5 + 0.2,
      speed: Math.random() * 0.4 + 0.05,
      alpha: Math.random() * 0.6 + 0.1,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
}

let menuRaf = null;
function drawMenuBg() {
  if (menuRaf) cancelAnimationFrame(menuRaf);
  function frame() {
    if (!game.running) {
      ctx.fillStyle = '#04040f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        s.twinkle += 0.02;
        const a = s.alpha + Math.sin(s.twinkle) * 0.15;
        ctx.fillStyle = `rgba(255,255,255,${Math.max(0,a)})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      }
      menuRaf = requestAnimationFrame(frame);
    }
  }
  frame();
}

// ═══════════════════════════════════════════════════════
//  UI SETUP
// ═══════════════════════════════════════════════════════
function setupUI() {
  // Theme picker
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => selectTheme(btn.dataset.theme));
  });

  document.getElementById('btnStart').addEventListener('click', handleStart);
  document.getElementById('userInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleStart(); });
  document.getElementById('btnLeaderboard').addEventListener('click', showLeaderboard);
  document.getElementById('btnBackLb').addEventListener('click', () => show('screenWelcome'));
  document.getElementById('btnReplay').addEventListener('click', () => { show('screenWelcome'); setTimeout(handleStart, 50); });
  document.getElementById('btnHome').addEventListener('click', () => { show('screenWelcome'); drawMenuBg(); });

  // Touch controls
  setupTouchControls();
}

function selectTheme(theme) {
  const btn = document.querySelector(`.theme-btn[data-theme="${theme}"]`);
  if (!btn) return;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b === btn));
  selectedTheme = theme;
  Profile.set('theme', theme);
}

async function handleStart() {
  const raw = document.getElementById('userInput').value.trim();
  const id = raw.toUpperCase().replace(/[^A-Z0-9_]/g,'');
  const err = document.getElementById('inputError');
  if (id.length < 2) { err.textContent = 'ID debe tener al menos 2 caracteres'; return; }
  err.textContent = '';
  Profile.set('lastId', id);

  try {
    const res = await fetch(`${API}/user`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ id })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.error || 'Error de servidor'; return; }
    currentUser = { id: data.id, record: data.record || 0 };
    startGame();
  } catch(e) {
    // offline fallback
    currentUser = { id, record: 0, offline: true };
    startGame();
  }
}

// ═══════════════════════════════════════════════════════
//  SHOW / HIDE SCREENS
// ═══════════════════════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  if (id) document.getElementById(id).classList.remove('hidden');
}

function showTab(tab) {
  document.getElementById('panelStats').classList.toggle('hidden', tab !== 'stats');
  document.getElementById('panelLb').classList.toggle('hidden', tab !== 'lb');
  document.getElementById('tabStats').classList.toggle('active', tab === 'stats');
  document.getElementById('tabLb').classList.toggle('active', tab === 'lb');
  if (tab === 'lb') loadLeaderboardInto('goLbList');
}

// ═══════════════════════════════════════════════════════
//  LEADERBOARD
// ═══════════════════════════════════════════════════════
async function showLeaderboard() {
  show('screenLeaderboard');
  await loadLeaderboardInto('lbList');
}

async function loadLeaderboardInto(containerId) {
  const container = document.getElementById(containerId);
  try {
    const res = await fetch(`${API}/leaderboard`);
    const data = await res.json();
    renderLeaderboard(container, data.rows || []);
  } catch {
    container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;padding:20px;">Sin conexión</div>';
  }
}

function renderLeaderboard(container, rows) {
  if (!rows.length) {
    container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.3);font-size:0.8rem;padding:20px;">Aún no hay jugadores</div>';
    return;
  }
  const rankClass = i => i===0?'gold':i===1?'silver':i===2?'bronze':'';
  const rankIcon  = i => i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
  container.innerHTML = rows.map((r,i) => `
    <div class="lb-row ${currentUser&&r.id===currentUser.id?'lb-me':''}">
      <div class="lb-rank ${rankClass(i)}">${rankIcon(i)}</div>
      <div class="lb-name">${r.id}${currentUser&&r.id===currentUser.id?' (tú)':''}</div>
      <div class="lb-score">${r.record.toLocaleString()}</div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════════════
//  THEME HELPERS
// ═══════════════════════════════════════════════════════
function getEntityList(theme) {
  switch(theme) {
    case 'emoji':  return EMOJI_SETS;
    case 'pixel':  return PIXEL_SETS;
    case 'geo':    return GEO_SHAPES;
    case 'neon':   return NEON_SHAPES;
  }
  return GEO_SHAPES;
}

function randomEntity(theme, exclude) {
  const list = getEntityList(theme);
  const filtered = exclude ? list.filter(e => e !== exclude) : list;
  return filtered[Math.floor(Math.random() * filtered.length)];
}

// ═══════════════════════════════════════════════════════
//  DRAW ENTITY
// ═══════════════════════════════════════════════════════
function drawEntity(context, theme, entity, x, y, size, color, alpha=1, glow=false, rotation=0) {
  context.save();
  context.globalAlpha = alpha;
  context.translate(x, y);
  if (rotation) context.rotate(rotation);

  if (theme === 'emoji' || theme === 'pixel') {
    if (glow) { context.shadowBlur = 28; context.shadowColor = color; }
    context.font = `${Math.round(size * 1.8)}px serif`;
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillText(entity, 0, 0);
  } else {
    const isNeon = theme === 'neon';
    if (glow || isNeon) {
      context.shadowBlur = isNeon ? 32 : 20;
      context.shadowColor = color;
    }
    if (isNeon) {
      context.strokeStyle = color;
      context.lineWidth = 3;
      context.fillStyle = `rgba(${hexRgb(color)},0.12)`;
    } else {
      context.fillStyle = color;
      context.strokeStyle = 'rgba(255,255,255,0.25)';
      context.lineWidth = 2;
    }
    drawGeoPath(context, entity, 0, 0, size);
    if (isNeon) { context.fill(); context.stroke(); }
    else { context.fill(); context.stroke(); }
  }
  context.restore();
}

function drawGeoPath(context, shape, x, y, size) {
  context.beginPath();
  switch(shape) {
    case 'circle': context.arc(x,y,size,0,Math.PI*2); break;
    case 'square': context.roundRect(x-size,y-size,size*2,size*2,size*0.2); break;
    case 'triangle':
      context.moveTo(x,y-size); context.lineTo(x+size*0.866,y+size*0.5); context.lineTo(x-size*0.866,y+size*0.5); context.closePath(); break;
    case 'diamond':
      context.moveTo(x,y-size); context.lineTo(x+size*0.72,y); context.lineTo(x,y+size); context.lineTo(x-size*0.72,y); context.closePath(); break;
    case 'pentagon':
      for(let i=0;i<5;i++){const a=(i*2*Math.PI/5)-Math.PI/2;i===0?context.moveTo(x+size*Math.cos(a),y+size*Math.sin(a)):context.lineTo(x+size*Math.cos(a),y+size*Math.sin(a));}context.closePath();break;
    case 'star':
      for(let i=0;i<10;i++){const a=(i*Math.PI/5)-Math.PI/2,r=i%2===0?size:size*0.42;i===0?context.moveTo(x+r*Math.cos(a),y+r*Math.sin(a)):context.lineTo(x+r*Math.cos(a),y+r*Math.sin(a));}context.closePath();break;
    case 'hexagon':
      for(let i=0;i<6;i++){const a=(i*Math.PI/3)-Math.PI/6;i===0?context.moveTo(x+size*Math.cos(a),y+size*Math.sin(a)):context.lineTo(x+size*Math.cos(a),y+size*Math.sin(a));}context.closePath();break;
    case 'cross':
      const t=size*0.35;
      context.moveTo(x-t,y-size);context.lineTo(x+t,y-size);context.lineTo(x+t,y-t);
      context.lineTo(x+size,y-t);context.lineTo(x+size,y+t);context.lineTo(x+t,y+t);
      context.lineTo(x+t,y+size);context.lineTo(x-t,y+size);context.lineTo(x-t,y+t);
      context.lineTo(x-size,y+t);context.lineTo(x-size,y-t);context.lineTo(x-t,y-t);
      context.closePath();break;
  }
}

function hexRgb(hex){return`${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;}

// ═══════════════════════════════════════════════════════
//  GAME INIT
// ═══════════════════════════════════════════════════════
function laneX(lane) { return (canvas.width / LANE_COUNT) * lane + (canvas.width / LANE_COUNT) / 2; }

function startGame() {
  if (raf) cancelAnimationFrame(raf);
  if (menuRaf) cancelAnimationFrame(menuRaf);
  show(null); // hide all screens

  const theme = selectedTheme;
  const list = getEntityList(theme);
  const entity = list[Math.floor(Math.random() * list.length)];
  const color  = COLORS[Math.floor(Math.random() * COLORS.length)];

  game = {
    running: true, over: false, overTimer: 0,
    score: 0, lives: CONFIG.START_LIVES, level: 1,
    speed: 3.2, spawnRate: 85, frame: 0,
    correctCount: 0, fails: 0, perfects: 0, combo: 0, bestCombo: 0,
    bestAtStart: Math.max(Profile.get('bestScore'), currentUser?.record || 0),
    theme,
    particles: [], fallingShapes: [], explosions: [],
    bgParticles: [], trails: [], floaters: [],
    player: {
      lane: 1, targetLane: 1,
      entity, color,
      y: 0, vy: 0, jumping: false,
      baseY: canvas.height * 0.78,
      scale: 1, scaleAnim: 0,
      invincible: 0, wobble: 0,
      rotation: 0,
      laneAnim: 0, // smooth lane transition
      currentX: 0,
    },
  };
  game.player.y = game.player.baseY;
  game.player.currentX = laneX(1);

  updateHUD();
  updateHint();
  lastFrameTime = performance.now();
  accumulator = 0;
  raf = requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════
function loop(now) {
  if (!game.running) return;
  // Fixed 60Hz simulation: game speed is identical on 60/120/144Hz displays.
  accumulator += Math.min(now - lastFrameTime, CONFIG.MAX_FRAME_MS);
  lastFrameTime = now;
  while (accumulator >= CONFIG.STEP_MS) {
    step();
    accumulator -= CONFIG.STEP_MS;
  }
  draw();
  raf = requestAnimationFrame(loop);
}

function step() {
  game.frame++;

  if (!game.over) {
    if (game.frame % game.spawnRate === 0) spawnFallingShape();
  } else if (--game.overTimer <= 0) {
    endGame();
    return;
  }
  if (game.frame % 3 === 0) spawnBgParticle();

  updatePlayer();
  updateShapes();
  updateParticles();
  updateExplosions();
  updateBgParticles();
  updateTrails();
  Fx.update();
}

// ═══════════════════════════════════════════════════════
//  SPAWN
// ═══════════════════════════════════════════════════════
// The target is whatever the player currently looks like; catching it evolves the player.
function isTarget(shape) {
  return shape.entity === game.player.entity && shape.color === game.player.color;
}

// What the player will become after the next catch (evolution is deterministic).
function nextTarget() {
  const p = game.player;
  const list = getEntityList(game.theme);
  return {
    entity: list[(list.indexOf(p.entity) + 1) % list.length],
    color: COLORS[(COLORS.indexOf(p.color) + 1) % COLORS.length],
  };
}

function pickOther(list, exclude) {
  const options = list.filter(v => v !== exclude);
  return options[Math.floor(Math.random() * options.length)];
}

// Decoys never look like the current target NOR the next one, so what you see is what scores.
function makeDecoy() {
  const p = game.player;
  const next = nextTarget();
  const list = getEntityList(game.theme);
  for (let attempt = 0; attempt < 20; attempt++) {
    const t = Math.random();
    let entity, color;
    if (t < 0.38)      { entity = pickOther(list, p.entity); color = p.color; }
    else if (t < 0.76) { entity = p.entity; color = pickOther(COLORS, p.color); }
    else               { entity = pickOther(list, p.entity); color = pickOther(COLORS, p.color); }
    if (entity === next.entity && color === next.color) continue;
    return { entity, color };
  }
  return { entity: pickOther(list, p.entity), color: p.color };
}

function spawnFallingShape() {
  const lane = Math.floor(Math.random() * LANE_COUNT);
  // Only one target-looking shape in flight at a time: catching it changes the target.
  const targetInFlight = game.fallingShapes.some(isTarget);
  const wantTarget = !targetInFlight && Math.random() < 0.32;
  const look = wantTarget ? { entity: game.player.entity, color: game.player.color } : makeDecoy();

  game.fallingShapes.push({
    lane, entity: look.entity, color: look.color,
    y: -50, size: 22,
    rotation: 0, rotSpeed: (Math.random()-0.5)*0.08,
    wobble: 0, wobbleSpeed: Math.random()*0.1+0.05,
    scale: 1, scalePhase: Math.random()*Math.PI*2,
    trail: [],
  });
}

function spawnBgParticle() {
  game.bgParticles.push({
    x: Math.random() * canvas.width,
    y: canvas.height + 10,
    vy: -(Math.random()*1.5+0.5),
    vx: (Math.random()-0.5)*0.5,
    r: Math.random()*2+0.5,
    alpha: Math.random()*0.3+0.05,
    color: COLORS[Math.floor(Math.random()*COLORS.length)],
  });
}

function spawnParticles(x, y, color, count=16) {
  for (let i=0;i<count;i++) {
    const angle = (Math.PI*2/count)*i + Math.random()*0.5;
    const speed = 3 + Math.random()*6;
    game.particles.push({
      x, y, color,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
      life: 1, decay: 0.022+Math.random()*0.02,
      size: 3+Math.random()*6, rot: Math.random()*Math.PI*2,
    });
  }
}

function spawnExplosion(x, y, color) {
  game.explosions.push({ x, y, color, frame:0, maxFrame:28 });
  spawnParticles(x, y, color, 22);
  // screen shake
  game.shake = 10;
}

// ═══════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════
function updatePlayer() {
  const p = game.player;

  // Smooth lane movement
  const targetX = laneX(p.targetLane);
  p.currentX += (targetX - p.currentX) * 0.18;
  p.lane = p.targetLane;

  // Jump physics
  if (p.jumping) {
    p.vy += 0.8;
    p.y  += p.vy;
    p.rotation += 0.12;
    if (p.y >= p.baseY) { p.y = p.baseY; p.vy = 0; p.jumping = false; p.rotation = 0; spawnLandDust(); }
  }

  // Scale anim (collect bounce)
  if (p.scaleAnim > 0) {
    p.scale = 1 + Math.sin(p.scaleAnim * 0.28) * 0.28;
    p.scaleAnim--;
    if (p.scaleAnim <= 0) p.scale = 1;
  }

  // Trail
  game.trails.push({ x: p.currentX, y: p.y, color: p.color, alpha: 0.35, size: 26 });
  if (game.trails.length > 12) game.trails.shift();

  if (p.invincible > 0) p.invincible--;
  if (p.wobble > 0) p.wobble--;
  if (game.shake > 0) game.shake -= 0.8;
}

function spawnLandDust() {
  const p = game.player;
  for (let i=0;i<8;i++) {
    const angle = Math.PI + (Math.random()-0.5)*1.2;
    game.particles.push({
      x: p.currentX, y: p.baseY+10, color: '#ffffff',
      vx: Math.cos(angle)*(2+Math.random()*3), vy: Math.sin(angle)*(2+Math.random()*2),
      life:0.7, decay:0.05, size:2+Math.random()*3,
    });
  }
}

function laneWidth() { return canvas.width / LANE_COUNT; }

function updateShapes() {
  const p = game.player;
  for (let i = game.fallingShapes.length - 1; i >= 0; i--) {
    const s = game.fallingShapes[i];
    s.y += game.speed;
    s.rotation += s.rotSpeed;
    s.scalePhase += s.wobbleSpeed;
    s.scale = 1 + Math.sin(s.scalePhase) * 0.08;

    s.trail.push({ x: laneX(s.lane), y: s.y, alpha: 0.3 });
    if (s.trail.length > 6) s.trail.shift();

    const dx = Math.abs(laneX(s.lane) - p.currentX);
    const dy = Math.abs(s.y - p.y);
    const hitDx = laneWidth() * CONFIG.HIT_X_LANE_FRACTION;
    const inReach = dx < hitDx && dy < CONFIG.HIT_Y_PX;

    // Distance (px) by which this shape has missed the catch window, at its closest.
    s.closestGap = Math.min(s.closestGap ?? Infinity, Math.hypot(Math.max(0, dx - hitDx), Math.max(0, dy - CONFIG.HIT_Y_PX)));

    // Correct shapes can always be caught; invincibility only shields from damage.
    if (inReach && (isTarget(s) || p.invincible === 0) && !game.over) {
      game.fallingShapes.splice(i, 1);
      if (isTarget(s)) onCatch(s, dx / laneWidth());
      else onWrongHit(s);
      continue;
    }

    // Shape went below the player row: it can no longer be caught.
    if (!s.passed && s.y > p.baseY + CONFIG.HIT_Y_PX) {
      s.passed = true;
      if (isTarget(s) && !game.over) onMissedTarget(s);
    }
    if (s.y > canvas.height + 60) game.fallingShapes.splice(i, 1);
  }
}

/** Player caught the target. `offset` = horizontal error as a fraction of lane width. */
function onCatch(s, offset) {
  const p = game.player;
  const precision = ScoreManager.precisionFor(offset);
  const prevTier = ComboManager.tierIndex(game.combo);

  game.combo++;
  game.bestCombo = Math.max(game.bestCombo, game.combo);
  game.correctCount++;
  if (precision.name === 'PERFECT') game.perfects++;

  const mult = ComboManager.multiplierFor(game.combo);
  const gain = ScoreManager.gain(mult, precision);
  game.score += gain;

  p.scaleAnim = 24;
  spawnParticles(p.currentX, p.y, p.color, 20);
  const tierUp = ComboManager.tierIndex(game.combo) > prevTier;
  const tierColor = COMBO_COLORS[ComboManager.tierIndex(game.combo)];
  Fx.floatText(p.currentX, p.y - 60, '+' + gain, tierColor, 26);
  Fx.floatText(p.currentX, p.y - 88, precision.name, precision.name === 'PERFECT' ? '#ffffff' : 'rgba(255,255,255,0.7)', 15);
  if (tierUp) Fx.floatText(p.currentX, p.y - 122, 'COMBO x' + mult, tierColor, 22, 1.25);

  const next = nextTarget();
  p.entity = next.entity;
  p.color  = next.color;

  updateHUD(tierUp ? 'pop' : null);
  updateHint();
}

function onWrongHit(s) {
  const p = game.player;
  const hadCombo = game.combo > 1;
  game.combo = 0;
  game.fails++;
  spawnExplosion(p.currentX, p.y, s.color);
  Fx.floatText(p.currentX, p.y - 60, 'OUCH', '#ff006e', 22);
  p.invincible = 90; p.wobble = 24;
  game.lives--;
  updateHUD(hadCombo ? 'lost' : null);
  if (game.lives <= 0) { game.over = true; game.overTimer = CONFIG.GAME_OVER_DELAY_FRAMES; }
}

/** A target slipped past. Only "near" if it really came within NEAR_MISS_PX of the catch window. */
function onMissedTarget(s) {
  const hadCombo = game.combo > 1;
  game.combo = 0;
  game.fails++;
  const near = s.closestGap <= CONFIG.NEAR_MISS_PX;
  const x = Math.min(Math.max(laneX(s.lane), 60), canvas.width - 60);
  Fx.floatText(x, game.player.baseY + 70, near ? 'SO CLOSE' : 'MISSED', near ? '#ffbe0b' : 'rgba(255,255,255,0.55)', near ? 20 : 16);
  updateHUD(hadCombo ? 'lost' : null);
}

function updateParticles() {
  for(let i=game.particles.length-1;i>=0;i--){
    const p=game.particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=p.decay;
    if(p.life<=0) game.particles.splice(i,1);
  }
}

function updateExplosions() {
  for(let i=game.explosions.length-1;i>=0;i--){
    game.explosions[i].frame++;
    if(game.explosions[i].frame>=game.explosions[i].maxFrame) game.explosions.splice(i,1);
  }
}

function updateBgParticles() {
  for(let i=game.bgParticles.length-1;i>=0;i--){
    const p=game.bgParticles[i];
    p.x+=p.vx; p.y+=p.vy;
    if(p.y<-20) game.bgParticles.splice(i,1);
  }
}

function updateTrails() {
  for(let i=game.trails.length-1;i>=0;i--){
    game.trails[i].alpha-=0.04;
    if(game.trails[i].alpha<=0) game.trails.splice(i,1);
  }
}

// ═══════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════
function draw() {
  const shake = game.shake||0;
  const sx = shake > 0 ? (Math.random()-0.5)*shake : 0;
  const sy = shake > 0 ? (Math.random()-0.5)*shake : 0;

  ctx.save();
  ctx.translate(sx, sy);

  drawBackground();
  drawBgParticles();
  drawLaneHighlights();
  drawShapeTrails();
  drawFallingShapes();
  drawPlayerTrail();
  drawExplosions();
  drawParticles();
  drawPlayer();
  Fx.draw();

  ctx.restore();
}

function drawBackground() {
  // Deep space gradient
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,'#04040f');
  grad.addColorStop(1,'#080820');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Stars
  for(const s of stars){
    s.twinkle+=0.015;
    const a=s.alpha+Math.sin(s.twinkle)*0.1;
    ctx.fillStyle=`rgba(255,255,255,${Math.max(0,a)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    s.y+=s.speed*0.3;
    if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;}
  }

  // Lane lines
  const lw = canvas.width/LANE_COUNT;
  for(let i=1;i<LANE_COUNT;i++){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.05)';
    ctx.lineWidth=1;
    ctx.setLineDash([16,28]);
    ctx.lineDashOffset=-(game.frame*2.5%44);
    ctx.beginPath(); ctx.moveTo(lw*i,0); ctx.lineTo(lw*i,canvas.height); ctx.stroke();
    ctx.restore();
  }

  // Ground glow
  const gy = game.player.baseY + 32;
  const grd = ctx.createLinearGradient(0,gy-20,0,gy+20);
  grd.addColorStop(0,'transparent');
  grd.addColorStop(0.5,`rgba(${hexRgb(game.player.color)},0.25)`);
  grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.fillRect(0,gy-20,canvas.width,40);

  ctx.strokeStyle=`rgba(${hexRgb(game.player.color)},0.4)`;
  ctx.lineWidth=2; ctx.shadowBlur=12; ctx.shadowColor=game.player.color;
  ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke();
  ctx.shadowBlur=0;
}

function drawBgParticles() {
  for(const p of game.bgParticles){
    ctx.fillStyle=p.color; ctx.globalAlpha=p.alpha;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawLaneHighlights() {
  // Subtle lane hover glow under player
  const lw=canvas.width/LANE_COUNT;
  const px=game.player.currentX;
  const grad=ctx.createRadialGradient(px,game.player.baseY+32,0,px,game.player.baseY+32,lw*0.6);
  grad.addColorStop(0,`rgba(${hexRgb(game.player.color)},0.08)`);
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
}

function drawShapeTrails() {
  for(const s of game.fallingShapes){
    for(let i=0;i<s.trail.length;i++){
      const t=s.trail[i];
      const a=(i/s.trail.length)*0.2;
      ctx.globalAlpha=a;
      ctx.fillStyle=s.color;
      ctx.beginPath(); ctx.arc(t.x,t.y,s.size*0.5*(i/s.trail.length),0,Math.PI*2); ctx.fill();
    }
  }
  ctx.globalAlpha=1;
}

function drawFallingShapes() {
  for(const s of game.fallingShapes){
    drawEntity(ctx,game.theme,s.entity,laneX(s.lane),s.y,s.size*s.scale,s.color,1,true,s.rotation);

    // Match indicator glow ring
    if(isTarget(s)){
      ctx.save();
      ctx.globalAlpha=0.25+Math.sin(game.frame*0.15)*0.2;
      ctx.strokeStyle=s.color; ctx.lineWidth=2;
      ctx.shadowBlur=15; ctx.shadowColor=s.color;
      ctx.beginPath(); ctx.arc(laneX(s.lane),s.y,s.size*1.6,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
}

function drawPlayerTrail() {
  for(let i=0;i<game.trails.length;i++){
    const t=game.trails[i];
    ctx.globalAlpha=t.alpha*0.5;
    ctx.fillStyle=t.color;
    ctx.shadowBlur=10; ctx.shadowColor=t.color;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.size*(i/game.trails.length)*0.5,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}

function drawPlayer() {
  const p=game.player;
  const wx=p.wobble>0?Math.sin(p.wobble*0.9)*6:0;

  // Glow orb beneath
  const a=p.invincible>0?0.2+Math.sin(p.invincible*0.35)*0.25:0.15;
  const grad=ctx.createRadialGradient(p.currentX,p.baseY+20,0,p.currentX,p.baseY+20,38);
  grad.addColorStop(0,`rgba(${hexRgb(p.color)},${a})`);
  grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad; ctx.fillRect(0,p.baseY-20,canvas.width,80);

  // Invincible flash
  const alpha=p.invincible>0?0.3+Math.sin(p.invincible*0.45)*0.5:1;

  ctx.save();
  ctx.translate(p.currentX+wx,p.y);
  ctx.scale(p.scale,p.scale);
  drawEntity(ctx,game.theme,p.entity,0,0,28,p.color,alpha,true,p.rotation);

  // Shield ring when invincible
  if(p.invincible>0){
    ctx.globalAlpha=0.6;
    ctx.strokeStyle=p.color; ctx.lineWidth=2;
    ctx.shadowBlur=20; ctx.shadowColor=p.color;
    ctx.beginPath(); ctx.arc(0,0,38,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for(const p of game.particles){
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color; ctx.shadowBlur=10; ctx.shadowColor=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawExplosions() {
  for(const e of game.explosions){
    const t=e.frame/e.maxFrame;
    // Multi-ring
    for(let r=0;r<3;r++){
      const tr=Math.max(0,t-(r*0.15));
      ctx.save(); ctx.globalAlpha=(1-tr)*0.7;
      ctx.strokeStyle=e.color; ctx.shadowBlur=25; ctx.shadowColor=e.color;
      ctx.lineWidth=(3-r)*(1-tr);
      ctx.beginPath(); ctx.arc(e.x,e.y,tr*70+r*10,0,Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════
//  HUD / OVERLAYS
// ═══════════════════════════════════════════════════════
/** Refreshes HUD text. `comboAnim` = 'pop' (multiplier went up) | 'lost' (combo broken) | null. */
function updateHUD(comboAnim = null) {
  const hud = document.getElementById('comboHud');
  const mult = ComboManager.multiplierFor(game.combo);
  document.getElementById('hudScore').textContent = game.score.toLocaleString();
  document.getElementById('hudBest').textContent = Math.max(game.bestAtStart, game.score).toLocaleString();
  document.getElementById('hudLives').textContent = '❤️'.repeat(game.lives) + '🖤'.repeat(Math.max(0, CONFIG.START_LIVES - game.lives));
  const multEl = document.getElementById('comboMult');
  multEl.textContent = 'x' + mult;
  multEl.style.color = COMBO_COLORS[ComboManager.tierIndex(game.combo)];
  document.getElementById('comboCount').textContent = game.combo > 1 ? game.combo + ' STREAK' : '';
  document.getElementById('xpFill').style.width = (ComboManager.progress(game.combo) * 100) + '%';
  if (comboAnim) {
    hud.classList.remove('pop', 'lost');
    void hud.offsetWidth;  // restart the CSS animation
    hud.classList.add(comboAnim);
  }
}

function updateHint() {
  hintCtx.clearRect(0,0,34,34);
  drawEntity(hintCtx,game.theme,game.player.entity,17,17,12,game.player.color,1,true);
}

let flashTimer=null;
function showFlash(text,color='#00f5ff'){
  const el=document.getElementById('flashMsg');
  el.textContent=text; el.style.color=color; el.style.borderColor=color;
  el.style.background=`rgba(${hexRgb(color)},0.12)`;
  el.classList.add('show');
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>el.classList.remove('show'),1200);
}

// ═══════════════════════════════════════════════════════
//  EFFECTS — floating text (canvas-drawn, short and non-blocking)
// ═══════════════════════════════════════════════════════
const Fx = {
  floatText(x, y, text, color, size, popScale = 1) {
    if (game.floaters.length >= CONFIG.MAX_FLOATERS) game.floaters.shift();
    game.floaters.push({ x, y, text, color, size, popScale, age: 0 });
  },
  update() {
    for (let i = game.floaters.length - 1; i >= 0; i--) {
      if (++game.floaters[i].age >= CONFIG.FLOATER_FRAMES) game.floaters.splice(i, 1);
    }
  },
  draw() {
    for (const f of game.floaters) {
      const t = f.age / CONFIG.FLOATER_FRAMES;
      const pop = t < 0.18 ? 0.6 + 0.4 * easeOutBack(t / 0.18) * f.popScale : 1;   // quick pop-in
      const x = Math.min(Math.max(f.x, 70), canvas.width - 70);
      ctx.save();
      ctx.globalAlpha = t < 0.6 ? 1 : 1 - (t - 0.6) / 0.4;
      ctx.translate(x, f.y - easeOutCubic(t) * 34);
      ctx.scale(pop, pop);
      ctx.font = `900 ${f.size}px Orbitron, monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(4,4,15,0.75)'; ctx.lineJoin = 'round';
      ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = f.color; ctx.shadowBlur = 12; ctx.shadowColor = f.color;
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
  },
};
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

// ═══════════════════════════════════════════════════════
//  TOUCH CONTROLS
// ═══════════════════════════════════════════════════════
function setupTouchControls() {
  let tx=0,ty=0,tt=0;
  canvas.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    const t=e.touches[0]; tx=t.clientX; ty=t.clientY; tt=Date.now();
  },{passive:false});

  canvas.addEventListener('touchend',(e)=>{
    e.preventDefault();
    if(!game.running) return;
    const t=e.changedTouches[0];
    const dx=t.clientX-tx, dy=t.clientY-ty, dt=Date.now()-tt;

    // Swipe up = jump
    if(dy<-50&&Math.abs(dy)>Math.abs(dx)&&dt<350){
      if(!game.player.jumping){ game.player.jumping=true; game.player.vy=-17; }
      return;
    }
    // Tap or swipe left/right
    if(Math.abs(dx)<50&&Math.abs(dy)<50){
      // tap
      if(t.clientX < canvas.width/2) game.player.targetLane=Math.max(0,game.player.targetLane-1);
      else game.player.targetLane=Math.min(LANE_COUNT-1,game.player.targetLane+1);
    } else if(Math.abs(dx)>40){
      if(dx<0) game.player.targetLane=Math.max(0,game.player.targetLane-1);
      else game.player.targetLane=Math.min(LANE_COUNT-1,game.player.targetLane+1);
    }
  },{passive:false});

  // Keyboard
  document.addEventListener('keydown',(e)=>{
    if(!game.running) return;
    if(e.key==='ArrowLeft') game.player.targetLane=Math.max(0,game.player.targetLane-1);
    if(e.key==='ArrowRight') game.player.targetLane=Math.min(LANE_COUNT-1,game.player.targetLane+1);
    if((e.key==='ArrowUp'||e.key===' ')&&!game.player.jumping){game.player.jumping=true;game.player.vy=-17;}
  });
}

// ═══════════════════════════════════════════════════════
//  GAME OVER
// ═══════════════════════════════════════════════════════
/** Lifetime stats kept on this device. */
function recordRunStats() {
  Profile.update({
    bestScore: Math.max(Profile.get('bestScore'), game.score),
    totalGames: Profile.get('totalGames') + 1,
    totalScore: Profile.get('totalScore') + game.score,
    totalShapes: Profile.get('totalShapes') + game.correctCount,
    highestCombo: Math.max(Profile.get('highestCombo'), game.bestCombo),
    totalHits: Profile.get('totalHits') + game.correctCount,
    perfectHits: Profile.get('perfectHits') + game.perfects,
  });
}

async function endGame() {
  game.running=false;
  if(raf){cancelAnimationFrame(raf);raf=null;}
  recordRunStats();

  // Save score
  const previousRecord = currentUser?.record || 0;
  let record = previousRecord;
  if(!currentUser?.offline && currentUser?.id){
    try{
      const res=await fetch(`${API}/score`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:currentUser.id,score:game.score})
      });
      const d=await res.json();
      record=d.record||record;
      currentUser.record=record;
    }catch{}
  }

  const isNew=game.score>previousRecord;
  document.getElementById('goTitle').textContent=isNew?'🏆 NUEVO RÉCORD':'GAME OVER';
  document.getElementById('goScore').textContent=game.score.toLocaleString();
  document.getElementById('goRecord').textContent=record.toLocaleString();
  document.getElementById('goCorrect').textContent=game.correctCount;
  document.getElementById('goBestCombo').textContent=game.bestCombo+'x';
  document.getElementById('goLevel').textContent='—';

  show('screenGameOver');
  showTab('stats');
  drawMenuBg();
}
